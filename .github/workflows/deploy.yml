name: Auto Deploy to HostDare

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Connect SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /root/sukjmart
            git fetch origin main
            git reset --hard origin/main
            npm install
            # 기존 찌꺼기 삭제
            pm2 delete ecosystem_config || true
            pm2 delete lineage-game-server || true
            # 설정 파일 안에 정의된 정보대로 재시작/실행
            pm2 start ecosystem_config.js
            pm2 save
